<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h2>📋 Task Manager</h2>

  <form id="taskForm" class="mb-4">
    <input type="text" id="title" class="form-control mb-2" placeholder="Title" required>
    <input type="text" id="description" class="form-control mb-2" placeholder="Description">
    <button type="submit" class="btn btn-primary">Add Task</button>
  </form>

  <ul id="taskList" class="list-group"></ul>

  <!-- Update Task Modal -->
  <div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="updateModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="updateModalLabel">Update Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="updateTitle" class="form-control mb-2" placeholder="Title" required>
          <input type="text" id="updateDescription" class="form-control mb-2" placeholder="Description">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick="updateTask()">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "/api/tasks";
    let currentTaskId = null;

    const taskList = document.getElementById("taskList");
    const form = document.getElementById("taskForm");

    const loadTasks = async () => {
      const res = await fetch(API_URL);
      const tasks = await res.json();
      taskList.innerHTML = "";
      tasks.forEach(task => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between";
        li.innerHTML = `
          <span>
            <strong>${task.title}</strong>: ${task.description}
          </span>
          <span>
            <button onclick="deleteTask('${task.id}')" class="btn btn-sm btn-danger">Delete</button>
            <button onclick="openUpdateModal('${task.id}', '${task.title}', '${task.description}')" class="btn btn-sm btn-warning">Update</button>
          </span>`;
        taskList.appendChild(li);
      });
    };

    form.onsubmit = async e => {
      e.preventDefault();
      const title = document.getElementById("title").value;
      const description = document.getElementById("description").value;
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, description, completed: false })
      });
      form.reset();
      loadTasks();
    };

    const deleteTask = async (id) => {
      await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      loadTasks();
    };

    // Open the update modal and populate the fields
    const openUpdateModal = (id, title, description) => {
      currentTaskId = id;
      document.getElementById("updateTitle").value = title;
      document.getElementById("updateDescription").value = description;
      const updateModal = new bootstrap.Modal(document.getElementById("updateModal"));
      updateModal.show();
    };

    // Handle updating the task
    const updateTask = async () => {
      const updatedTitle = document.getElementById("updateTitle").value;
      const updatedDescription = document.getElementById("updateDescription").value;

      await fetch(`${API_URL}/${currentTaskId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: updatedTitle, description: updatedDescription, completed: false })
      });
      loadTasks();

      // Close modal after update
      const updateModal = new bootstrap.Modal(document.getElementById("updateModal"));
      updateModal.hide();
    };

    loadTasks();
  </script>

  <!-- Bootstrap JS (required for modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
